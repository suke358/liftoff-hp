<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<title>{{SHOP}} 2回目の打ち合わせ チェック表</title>
<style>
@page{size:A4;margin:10mm 11mm}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans CJK JP","Hiragino Sans",sans-serif;color:#17283A;font-size:10.2pt;line-height:1.5}
h1{font-size:15pt;margin:0;white-space:nowrap}
.top{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2.5px solid #17283A;padding-bottom:4px;margin-bottom:6px}
.meta{font-size:9pt;text-align:right;white-space:nowrap}
.meta span{display:inline-block;border-bottom:1px solid #999;min-width:28mm;margin-left:4px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:0 6mm}
h2{font-size:10.5pt;margin:7px 0 3px;padding:2px 7px;background:#17283A;color:#fff;border-radius:4px}
h2.y{background:#F2C230;color:#17283A}
ul{list-style:none;margin:0;padding:0}
li{position:relative;padding:2px 0 2px 17px;border-bottom:1px dotted #c9d3db}
li::before{content:"";position:absolute;left:1px;top:4.5px;width:10px;height:10px;border:1.4px solid #17283A;border-radius:2px;background:#fff}
li.nb{padding-left:0}li.nb::before{display:none}
.n{display:inline-block;min-width:13px;font-weight:700}
small{color:#566A7C;font-size:8.4pt}
b{font-weight:700}
.rule li::before{border-color:#C9727F}
.memo{border:1px solid #999;border-radius:4px;height:26mm;margin-top:3px;padding:2px 5px;font-size:8.4pt;color:#999}
.foot{margin-top:5px;font-size:8.4pt;color:#566A7C;text-align:right}

li::before{display:none}
li{padding-left:0}
li label{display:flex;gap:6px;align-items:flex-start;cursor:pointer}
li input[type=checkbox]{width:14px;height:14px;margin:3px 0 0;flex:none;accent-color:#17283A}
li input[type=checkbox]:checked + span{color:#8a98a4;text-decoration:line-through}
.ans{display:block;width:calc(100% - 20px);margin:2px 0 2px 20px;font:inherit;font-size:9pt;border:1px solid #c9d3db;border-radius:4px;padding:1px 6px;background:#FFF9E5}
.when{font:inherit;font-size:9pt;border:none;border-bottom:1px solid #999;width:30mm;margin-left:4px;background:transparent}
textarea.memo{width:100%;font:inherit;font-size:9pt;color:#17283A;resize:vertical;background:#fff}
.bar{position:sticky;top:0;z-index:5;background:#F4F7F9;border-bottom:1px solid #D3DEE6;padding:8px 12px;display:flex;gap:8px;align-items:center;justify-content:space-between;font-size:9pt;color:#566A7C;margin:-2px -2px 8px}
.bar button{font:inherit;font-weight:700;font-size:9.5pt;border:2px solid #17283A;background:#fff;color:#17283A;border-radius:999px;padding:3px 12px;cursor:pointer}
.bar button.main{background:#17283A;color:#fff}
@media screen{body{max-width:210mm;margin:0 auto;padding:6mm 8mm;background:#fff}}
@media print{.bar{display:none}.ans{background:#fff}.ans:placeholder-shown{display:none}textarea.memo{border:1px solid #999}}
</style></head><body>
<div class="bar"><span id="state">チェック・書き込みは自動で保存されます（このMacのこのブラウザだけ）</span><span><button type="button" class="main" id="copy">Claudeに渡す用にコピー</button> <button type="button" onclick="window.print()">印刷</button></span></div>
<textarea id="out" style="display:none"></textarea>
<div class="top">
  <h1>{{SHOP}} 2回目の打ち合わせ チェック表</h1>
  <div class="meta">日時<input type="text" class="when" data-k="when" placeholder="10/  （ ）  :">　目安 1.5〜2時間</div>
</div>
<div class="cols">
<div>
  <h2>前日までに（自分）</h2>
  <ul>
    <li><label><input type="checkbox" data-k="c1"><span>名刺の見本を刷る（10枚）<br><small>「2 名刺の見本」の【刷るのはこれ】</small></span></label></li>
    <li><label><input type="checkbox" data-k="c2"><span>取り決めメモを2部印刷 <small>「1 次の打ち合わせで使うもの」</small></span></label></li>
    <li><label><input type="checkbox" data-k="c3"><span>ドメイン候補の空きを Claude に確認してもらう<br><small>候補2〜3個と更新料（Claude が用意）</small></span></label></li>
    <li><label><input type="checkbox" data-k="c4"><span>Mac を充電・予約メニュー入力シートが開くか</span></label></li>
    <li><label><input type="checkbox" data-k="c5"><span>もらう約束の写真の差し替えが済んでいるか</span></label></li>
  </ul>

  <h2>持ってきてもらう（オーナーさん）</h2>
  <ul>
    <li><label><input type="checkbox" data-k="c6"><span>スマホ</span></label></li>
    <li><label><input type="checkbox" data-k="c7"><span>Googleマップを管理している Google アカウント<br><small>思い当たる Gmail を全部</small></span></label></li>
    <li><label><input type="checkbox" data-k="c8"><span>お店用のメール（なければその場で作る）</span></label></li>
    <li><label><input type="checkbox" data-k="c9"><span>ドメイン代を払うカード</span></label></li>
    <li><label><input type="checkbox" data-k="c10"><span>直近1か月の休みの予定</span></label></li>
  </ul>

  <h2 class="y">その場で聞く</h2>
  <ul>
    <li><label><input type="checkbox" data-k="c11"><span>料金は税込か</span></label><input type="text" class="ans" data-k="a11" placeholder="答え"></li>
    <li><label><input type="checkbox" data-k="c12"><span>予約メニュー入力シートの黄色の欄<br><small>メニューごとの時間と料金、受け方のルール</small></span></label><input type="text" class="ans" data-k="a12" placeholder="答え"></li>
    <li><label><input type="checkbox" data-k="c13"><span>公式LINEの友だち追加URL<br><small>個人のLINEのIDではないか（ID検索で「検索を許可していません」なら個人）</small></span></label><input type="text" class="ans" data-k="a13" placeholder="答え"></li>
    <li><label><input type="checkbox" data-k="c14"><span>名刺に載せる名前・肩書き・LINEのID</span></label><input type="text" class="ans" data-k="a14" placeholder="答え"></li>
    <li><label><input type="checkbox" data-k="c15"><span>ロゴをサイトに入れる時期 <small>（ロゴを作る場合）</small></span></label><input type="text" class="ans" data-k="a15" placeholder="答え"></li>
    <li><label><input type="checkbox" data-k="c16"><span>連絡なしのキャンセルも全額か</span></label><input type="text" class="ans" data-k="a16" placeholder="答え"></li>
    <li><label><input type="checkbox" data-k="c17"><span>効果をうたう言葉を使っていないか <small>（メニュー名・説明。サイトでは言い換える）</small></span></label><input type="text" class="ans" data-k="a17" placeholder="答え"></li>
    <li><label><input type="checkbox" data-k="c18"><span>資格・修了証を載せてよいか</span></label><input type="text" class="ans" data-k="a18" placeholder="答え"></li>
    <li><label><input type="checkbox" data-k="c19"><span>営業時間・定休日・駐車場のあいまいな所</span></label><input type="text" class="ans" data-k="a19" placeholder="答え"></li>
    <li><label><input type="checkbox" data-k="c20"><span>お問い合わせフォームは要るか</span></label><input type="text" class="ans" data-k="a20" placeholder="答え"></li>
    <li><label><input type="checkbox" data-k="c99"><span>公式LINEのプロフィール（ホーム）にSNSのリンクを付けるか<br><small>付けるなら、公式LINEの管理アプリでその場で一緒に設定</small></span></label><input type="text" class="ans" data-k="a99" placeholder="答え"></li>
  </ul>
</div>
<div>
  <h2>当日の順番（時間のかかるものから）</h2>
  <ul>
    <li><label><input type="checkbox" data-k="c22"><span><span class="n">0</span> 名刺の見本を渡す → <b>2人のスマホで QR を読み、同じ画面か</b><br><small>トップの絵／下まで崩れなし／ボタン。違えばスクショと機種</small></span></label></li>
    <li><label><input type="checkbox" data-k="c23"><span><span class="n">1</span> Googleマップの管理画面に入れるか<br><small>マップ右上の丸いアイコン →「ビジネス プロフィール」。入れたら、こちらを「管理者」に追加</small></span></label></li>
    <li><label><input type="checkbox" data-k="c24"><span><span class="n">2</span> お店用のメール <small>（なければ Gmail を作る）</small></span></label></li>
    <li><label><input type="checkbox" data-k="c25"><span><span class="n">3</span> ドメインを取る<br><small>名前と更新料を伝えて OK → お店名義・お店のカードで → ネームサーバーを Cloudflare に</small></span></label></li>
    <li><label><input type="checkbox" data-k="c26"><span><span class="n">4</span> 予約カレンダー（RESERVA）<br><small>入力シートのとおり入れる → テスト予約でお知らせが届くか → 消す → 予約ページの URL を控える</small></span></label></li>
    <li><label><input type="checkbox" data-k="c27"><span><span class="n">5</span> Googleマップの整備<br><small>「Googleマップに入れる文.txt」と写真。サイトのリンクは本公開のあと</small></span></label></li>
    <li><label><input type="checkbox" data-k="c28"><span><span class="n">6</span> 外観・入口・駐車場の写真を撮る（足りないとき）</span></label></li>
    <li><label><input type="checkbox" data-k="c29"><span><span class="n">7</span> 取り決めメモに2人で目を通す → 記入 → 1部ずつ持つ</span></label></li>
  </ul>

  <h2>守ること</h2>
  <ul class="rule">
    <li><label><input type="checkbox" data-k="c30"><span>パスワードはオーナーさんが決めて、オーナーさんが控える<small>（こちらは控えない）</small></span></label></li>
    <li><label><input type="checkbox" data-k="c31"><span>予約の欄で病気・妊娠のことは聞かない<br><small>「妊娠中の方・持病のある方は事前にご相談ください」と書くだけ</small></span></label></li>
    <li><label><input type="checkbox" data-k="c32"><span>Googleマップの口コミは、こちらで書かない・お礼と引き換えに頼まない</span></label></li>
    <li><label><input type="checkbox" data-k="c33"><span>お店のお客さんの個人情報は、こちらで持たない</span></label></li>
  </ul>

  <h2>終わったら</h2>
  <ul>
    <li><label><input type="checkbox" data-k="c34"><span>入力シート →「Claudeに渡す用にコピー」→ チャットに貼る</span></label></li>
    <li><label><input type="checkbox" data-k="c35"><span>RESERVA の予約ページの URL・公式LINE の URL をチャットに貼る</span></label></li>
    <li><label><input type="checkbox" data-k="c36"><span>撮った写真を Claude に渡す</span></label></li>
  </ul>
  <textarea class="memo" data-k="memo" placeholder="メモ"></textarea>
</div>
</div>
<div class="foot">Lift-Off　2026/10/8 作成（手順の詳細はマニュアル 08）</div>
<script>
var KEY='{{SLUG}}-check-2nd-v1', st={};
try{st=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){st={}}
var els=[].slice.call(document.querySelectorAll('[data-k]'));
els.forEach(function(el){var v=st[el.getAttribute('data-k')]; if(v==null)return; if(el.type==='checkbox')el.checked=v; else el.value=v;});
function save(){var o={};els.forEach(function(el){o[el.getAttribute('data-k')]=el.type==='checkbox'?el.checked:el.value});
 try{localStorage.setItem(KEY,JSON.stringify(o));document.getElementById('state').textContent='保存しました（'+new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})+'）'}catch(e){document.getElementById('state').textContent='自動保存できません。終わったら必ずコピーしてください'}}
document.addEventListener('input',save);document.addEventListener('change',save);
function txt(){var L=['【{{SHOP}} 2回目の打ち合わせ チェック表】'+new Date().toLocaleDateString('ja-JP'),'日時：'+(document.querySelector('.when').value||'（未記入）')];
 [].forEach.call(document.querySelectorAll('h2'),function(h){L.push('■'+h.textContent);var ul=h.nextElementSibling;if(!ul||ul.tagName!=='UL')return;
  [].forEach.call(ul.querySelectorAll('li'),function(li){var c=li.querySelector('input[type=checkbox]'),t=li.querySelector('span').innerText.replace(/\s+/g,' ').trim(),a=li.querySelector('.ans');
   L.push((c&&c.checked?'[済] ':'[ ] ')+t+(a&&a.value?' → '+a.value:''));});});
 L.push('■メモ',document.querySelector('textarea.memo').value||'（なし）');return L.join('\n');}
document.getElementById('copy').onclick=function(){var t=txt(),b=this,done=function(){b.textContent='コピーしました';setTimeout(function(){b.textContent='Claudeに渡す用にコピー'},1800)};
 var fb=function(){var o=document.getElementById('out');o.style.display='block';o.style.width='100%';o.style.minHeight='200px';o.value=t;o.select();try{document.execCommand('copy');done()}catch(e){b.textContent='下の文を選んでコピー'}};
 try{navigator.clipboard.writeText(t).then(done,fb)}catch(e){fb()}};
</script>
</body></html>
